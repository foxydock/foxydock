map $ssl_server_name $fdn_sni {
    default    $ssl_server_name;
}

include snippets/example/by_version/v3/by_context/http/leaf_map_fdn_sni___preset_ssl_domain_name.conf;

map "$preset_ssl_domain_name" $fdn_ssl_domain_name {
    # 这里需要添加更多的具体映射规则以限制默认行为
    # 建议直接重新写一个 map
    # 若不采取行动，可能会导致安全事故
    # 需要额外自定义 "" 的映射规则
    default    $preset_ssl_domain_name;
}

map "$fdn_ssl_domain_name" $cert_dir_name {
    # 这里需要添加更多的具体映射规则以限制默认行为
    # 建议直接重新写一个 map
    # 若不采取行动，可能会导致安全事故
    default     $fdn_ssl_domain_name;
}

map "$cert_dir_name" $path_to_cert_file {
    default     /etc/nginx/ssl/${cert_dir_name}/fullchain.pem;
}

map "$cert_dir_name" $path_to_cert_key_file {
    default     /etc/nginx/ssl/${cert_dir_name}/key.pem;
}

map "$http_upgrade" $fdn_connection_upgrade {
    ""              close;
    # keep-alive    keep-alive;
    default         upgrade;
}


js_import fdn_ingress from snippets/example/by_version/v3/by_app/by_name/fdn/app/ingress/main.js;
js_import snippets/example/by_version/v3/by_app/by_name/fdn/http_var_map/http_var_map.js;
js_set $fdn_scheme http_var_map.getFdnFirstClientUrlScheme;
js_set $fdn_hostname http_var_map.getFdnFirstClientUrlHostname;
js_set $fdn_x_forward_port http_var_map.getFdnFirstClientUrlPort;
js_set $access_log_file_name http_var_map.getAccessLogFileName;

map "$fdn_hostname" $loggable {
    default         1;
}

map "$fdn_hostname" $fdn_default_upstream {
    # default         fdn_default_server;
    default         404;
}

map $upstream_http_content_type $fdn_disable_buffering {
    ~*text/event-stream.*          1; # SSE
    ~*application/x-mpegurl.*      1; # HLS
    # ~*video/.*                     1; # 所有视频
    # ~*audio/.*                     1; # 所有音频
    ~*application/.*stream.*       1; # 流式应用
    default                        0;
}

map "$http3" $fdn_http3_compatible_host_for_proxy {
    h3          ${fdn_hostname}:${fdn_x_forward_port};
    hq          ${fdn_hostname}:${fdn_x_forward_port};
    default     $http_host;
}

map "${fdn_scheme}${fdn_x_forward_port}" $fdn_root_request_url {
    https443    ${fdn_scheme}://${fdn_hostname};
    http80      ${fdn_scheme}://${fdn_hostname};
    default     ${fdn_scheme}://${fdn_http3_compatible_host_for_proxy};
}

map "${fdn_root_request_url}" $fdn_full_request_url {
    default     ${fdn_root_request_url}${request_uri};
}

js_set $fdn_x_ingress_scheme http_var_map.getFdnIngressScheme;
js_set $fdn_x_ingress_host http_var_map.getFdnIngressHost;

include snippets/config/by_version/v3/by_context/http/inject_leaf_map.conf;

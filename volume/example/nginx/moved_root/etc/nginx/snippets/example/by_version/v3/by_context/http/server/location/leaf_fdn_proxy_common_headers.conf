proxy_set_header Connection $fdn_connection_upgrade;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Referer $http_referer;
proxy_set_header Host $fdn_http3_compatible_host_for_proxy;
proxy_set_header X-Forwarded-Host $fdn_http3_compatible_host_for_proxy;
proxy_set_header X-Forwarded-Port $fdn_x_forward_port;
proxy_set_header X-Forwarded-Proto $fdn_scheme;
proxy_set_header X-Forwarded-Protocol $fdn_scheme;
proxy_set_header X-Scheme $fdn_scheme;
proxy_set_header X-Nginx-Proxy true;

if ($fdn_disable_buffering) {
    add_header X-Accel-Buffering "no";
}

proxy_set_header X-FDN-Ingress-Scheme $fdn_x_ingress_scheme;
proxy_set_header X-FDN-Ingress-Host $fdn_x_ingress_host;
proxy_set_header X-FDN-Ingress-Server-Port $fdn_x_ingress_server_port;
proxy_set_header X-FDN-Ingress-Remote-Addr $fdn_x_ingress_remote_addr;
